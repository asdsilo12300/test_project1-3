<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f1e9" />
  <title>Recommended Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="recipe-feature" aria-labelledby="section-title">
    <div class="ornament ornament--sun" aria-hidden="true"></div>
    <div class="ornament ornament--spoon" aria-hidden="true">✳</div>
    <div class="ornament ornament--spark" aria-hidden="true">✣</div>
    <div class="section-heading">
      <div>
        <h1 id="section-title">RECOMMENDED</h1>
        <p class="script-title">Recipes</p>
      </div>
      <div class="controls" aria-label="Recipe carousel controls">
        <button class="carousel-button" type="button" data-direction="previous" aria-label="Previous recipes">←</button>
        <button class="carousel-button" type="button" data-direction="next" aria-label="Next recipes">→</button>
      </div>
    </div>
    <div class="carousel-shell">
      <div class="recipe-track" id="recipe-track" aria-label="Recommended recipes" tabindex="0"></div>
    </div>
  </main>
</body>
</html>
